services:
  - type: web
    name: jansetu
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: npm_config_build_from_source
        value: "sqlite3"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
